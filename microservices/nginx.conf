worker_processes auto;

events {
    worker_connections 4096;
}

http {
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    upstream orders_backend {
        server order-service:3000;
        keepalive 32;
    }

    upstream products_backend {
        server product-service:3000;
        keepalive 32;
    }

    upstream pricing_backend {
        server pricing-service:3000;
        keepalive 32;
    }

    upstream payment_backend {
        server payment-service:3000;
        keepalive 32;
    }

    server {
        listen 80;

        location ^~ /api/orders {
            proxy_pass http://orders_backend;
        }

        location ^~ /api/products {
            proxy_pass http://products_backend;
        }

        location / {
            return 404;
        }
    }

    server {
        listen 8081;

        location ^~ /api/pricing {
            proxy_pass http://pricing_backend;
        }

        location ^~ /api/payment {
            proxy_pass http://payment_backend;
        }

        location / {
            return 404;
        }
    }
}
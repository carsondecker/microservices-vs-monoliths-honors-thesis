worker_processes auto;

events {
    worker_connections 4096;
}

http {
    resolver 127.0.0.11 valid=5s ipv6=off;

    # Shared proxy settings
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    server {
        listen 80;

        location ^~ /api/orders {
            set $orders http://order-service:3000;
            proxy_pass $orders;
        }

        location ^~ /api/products {
            set $products http://product-service:3000;
            proxy_pass $products;
        }

        location / {
            return 404;
        }
    }

    server {
        listen 8081;

        location ^~ /api/pricing {
            set $pricing http://pricing-service:3000;
            proxy_pass $pricing;
        }

        location ^~ /api/payment {
            set $payment http://payment-service:3000;
            proxy_pass $payment;
        }

        location / {
            return 404;
        }
    }
}